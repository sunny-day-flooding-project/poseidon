version: 1
disable_existing_loggers: False

formatters:
  default:
    format: '%(asctime)s - %(levelname)s - %(message)s'
  access:
    format: '%(asctime)s - %(levelname)s - %(message)s'

handlers:
  default:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stderr
  access:
    class: logging.StreamHandler
    formatter: access
    stream: ext://sys.stdout

loggers:
  # Application-specific logger
  myapp:
    level: DEBUG
    handlers: [default]
    propagate: no

root:
  level: INFO
  handlers: [default]
  propagate: no
