name: poseidon
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - cudatoolkit=11.2
  - conda-forge::opencv=5
  - pdal
  - rioxarray
  - zarr
  - numpy
  - matplotlib
  - cmocean
  - jupyter
  - scipy
  - scikit-image
  - pandas
  - geopandas
  - cupy
  - gdal
  - laspy
  - tqdm
  - mpi4py
  - contextily
  - cxx-compiler
  - c-compiler
  - rasterio
  - pytest
  - pytest-cov
  - pytest-mock
  - cucim
  - svgpath2mpl
  - dask
  - pytz
  - pip
  - python-dotenv

  - pip:
      - google-api-python-client
      - oauth2client==4.1.3
      - pydantic==2.13.4
      - SQLAlchemy==2.0.51
      - psycopg2-binary
 

